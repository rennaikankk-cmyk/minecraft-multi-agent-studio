services:
  vllm-sm121:
    image: minecraft-studio/vllm-sm121:8030ae625-cu1303-v5
    container_name: minecraft-studio-vllm-sm121-ornith
    restart: "no"
    ports:
      - "18100:18100"
    volumes:
      - "${SPARK_MODEL_PATH:-/home/rennaikank/models/alztrk--Ornith-1.5-35B-A3B-Abliterated-NVFP4/27bc96e998b3084f86a196f076c0b696195a93b1-modelopt-0.45.0-text-only}:/model:ro"
    command:
      - /model
      - --served-model-name
      - ornith-sm121-v5
      - --host
      - 0.0.0.0
      - --port
      - "18100"
      - --dtype
      - auto
      - --max-model-len
      - "131072"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
