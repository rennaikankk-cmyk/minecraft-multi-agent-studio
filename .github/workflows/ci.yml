name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable corepack (pnpm 11.9.0)
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Test + Build
        run: |
          cargo fmt --manifest-path packages/pathfinder-rs/Cargo.toml --check
          cargo test --manifest-path packages/pathfinder-rs/Cargo.toml --locked
          pnpm --filter @minecraft-studio/pathfinder-rs build
          node scripts/check-pathfinder-native.mjs
          pnpm check
