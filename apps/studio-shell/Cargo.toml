[package]
name = "minecraft-multi-agent-studio-shell"
version = "0.1.0"
description = "Rust/Tauri desktop shell for Minecraft Multi-Agent Studio"
authors = ["Minecraft Multi-Agent Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
