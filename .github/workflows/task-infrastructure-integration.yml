name: P1.3 quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-infra-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js 24.18.0 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0+sha512.bd682d5d03fe525ef7c9fd6780c6884d1e756ac4c9c9fe00c538782824310dcf90e3ddc4f53835f06dfaebd5085e41855e0bcbb3b60de2ac5bbab89e5036f03b --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # The pathfinder-rs cargo commands that used to be inlined in the gate step now live in the
      # root `check:rust` script, which the gate step invokes, so cargo does NOT run twice.
      - name: Run Rust gate (pathfinder-rs fmt + locked tests, studio-shell fmt + conditional check)
        # apps/studio-shell had never been compiled by any workflow. On 2026-09-11 it was verified
        # locally for the first time and THREE defects were found and fixed in this repo:
        #   1. `apps/studio-shell/icons/` did not exist at all. tauri-build requires `icons/icon.ico`
        #      to generate the Windows resource file, so compilation aborted. A placeholder icon set
        #      (icon.ico 16/32/48/256 + icon.png 512 + 32/128/128@2x png) is now committed.
        #      ⚠ These are generated placeholders, not real branding — replace when branding exists.
        #   2. Two genuine Rust compile errors: E0716 "temporary value dropped while borrowed" at
        #      src/main.rs:178 and :269 (`app.state::<Backend>().0.lock()` borrowed a temporary
        #      `State`). Both are fixed by binding the state to a `let`/scoped block first.
        #   3. `package.metadata does not exist` is NOT an error and needs no fix: it is a plain
        #      `println!` diagnostic from tauri-winres-0.3.6/src/helpers.rs:33.
        #
        # After (1) and (2), `cargo check --manifest-path apps/studio-shell/Cargo.toml` succeeds.
        # The ONE remaining precondition is the bundle resource:
        #   tauri.conf.json declares bundle.resources ["MinecraftMultiAgentStudioBackend.exe"], and
        #   tauri-build requires it to exist AT COMPILE TIME (an exact path errors with "resource path
        #   ... doesn't exist"; switching to a glob errors with "glob pattern ... didn't match any
        #   files"). That file is produced only by the Windows-only `pnpm build:exe`
        #   (scripts/build-studio-exe.mjs hard-fails on non-win32) and is copied into place by
        #   scripts/build-studio-shell.mjs before packaging. It cannot be removed from the config:
        #   src/main.rs:203-209 loads it from next to the shell executable at runtime.
        #   => `cargo check` is structurally impossible on a Linux runner.
        #
        # `node scripts/check-studio-shell.mjs` (invoked via `pnpm check:rust`) therefore runs the real
        # cargo check when the resource is present (Windows after `pnpm build:exe`) and prints an
        # explicit "SKIPPED — 本项未验证" notice when it is not. It never fakes a pass.
        # To gate this on Windows CI, add a windows-runner job that runs `pnpm build:exe` first.
        run: pnpm check:rust
      - name: Run complete offline quality gate
        run: |
          pnpm --filter @minecraft-studio/pathfinder-rs build
          node scripts/check-pathfinder-native.mjs
          pnpm check
      - name: Verify Minecraft acceptance workflow safety policy
        run: pnpm check:minecraft-workflow
      - name: Verify authenticated Runtime Link across processes
        run: node scripts/run-runtime-link-acceptance.mjs
      - name: Verify the four-process local control path
        run: node scripts/run-four-process-acceptance.mjs

  real-postgres-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_DB: studio_tasks
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_tasks"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      TASK_POSTGRES_URL: postgresql://studio:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/studio_tasks
      TASK_REDIS_URL: redis://127.0.0.1:6379/0
      TASK_INFRA_TEST_NAMESPACE: studio_test_run${{ github.run_id }}_try${{ github.run_attempt }}
      WORLD_MEMORY_POSTGRES_URL: postgresql://studio:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/studio_tasks
      WORLD_MEMORY_INFRA_TEST_NAMESPACE: studio_test_world_run${{ github.run_id }}_try${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js 24.18.0 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0+sha512.bd682d5d03fe525ef7c9fd6780c6884d1e756ac4c9c9fe00c538782824310dcf90e3ddc4f53835f06dfaebd5085e41855e0bcbb3b60de2ac5bbab89e5036f03b --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real isolated PostgreSQL and Redis tests
        run: pnpm test:task-infra
      - name: Run real isolated PostgreSQL world memory tests
        run: pnpm test:world-memory-infra
