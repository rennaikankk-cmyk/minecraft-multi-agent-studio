[package]
name = "pathfinder-rs"
version = "0.1.0"
edition = "2021"
description = "Voxel A* pathfinder for minecraft-studio (clean-room: Baritone-inspired threading/cost architecture, no Baritone code). Node addon via napi-rs."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[profile.release]
opt-level = 3
lto = true
